name: Check code on PR
on: 
  pull_request: 
  workflow_dispatch: 
permissions: 
    contents: read
concurrency: 
    group: ${{ github.workflow }}-${{ github.ref }}
jobs:
    changes:
      runs-on: ubuntu-latest
      permissions: 
        pull-requests: read
      outputs:
        components-changed: ${{ steps.changes.outputs.changes }}
      steps:
        - name: Paths Changes Filter
          uses: dorny/paths-filter@v4.0.3
          id: changes
          with:
            filters: |
              download:
              - 'download/**'
              embed:
                - 'embed/**'
              backend:
                - 'backend/**'
              orchestrator:
                - 'orchestrator/**'
              frontend:
                - 'frontend/**'
              speakers:
                - 'speakers/**'
    python-check:
      needs: changes
      runs-on: ubuntu-latest
      strategy:
        matrix:
          components: ${{ fromJson(needs.changes.outputs.components-changed) }}
          exclude: 
            - components: frontend
            - components: speakers
      defaults:
        run:
          working-directory: ${{ matrix.components }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Set up Python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
          with:
            python-version-file: "${{matrix.components}}/pyproject.toml"
        - name: Setup uv
          uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
          id: setup-uv
          with:
            version: "0.10.7"
            enable-cache: true
            working-directory: ${{matrix.components}}
        - name: Install dependencies
          run: uv sync --locked --only-dev
        - name: Run checks
          run: | 
            uv run pytest 
            uv run ruff check 
            uv run ruff format --check 
    js-check:
      runs-on: ubuntu-latest
      needs: changes
      strategy:
        matrix:
          components: ${{ fromJson(needs.changes.outputs.components-changed) }}
          exclude: 
            - components: backend
            - components: download
            - components: embed
            - components: orchestrator
      defaults:
        run:
          working-directory: ${{ matrix.components }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Setup bun
          uses: oven-sh/setup-bun@v2 
        - name: Cache dependencies
          uses: actions/cache@v6
          id: cache
          with:
            path: |
              ~/.bun/install/cache
            key: ${{ matrix.components }}-bun-${{ hashFiles(format('{0}/bun.lock', matrix.components)) }}
        - name: Install dependencies
          run: bun ci
        - name: Run checks
          run: |
            bun test
            bun run lint
            bun run format:check
            bun run build