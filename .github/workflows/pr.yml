name: Check code on PR
on: 
  pull_request: 
  workflow_dispatch: 
permissions: 
    contents: read
concurrency: 
    group: ${{ github.workflow }}-${{ github.ref }}
jobs:
    changes:
      runs-on: ubuntu-latest
      permissions: 
        pull-requests: read
      outputs:
        components-changed: ${{ steps.changes.outputs.changes }}
      steps:
        - name: Paths Changes Filter
          uses: dorny/paths-filter@v4.0.3
          id: changes
          with:
            filters: |
              download:
              - 'download/**'
              embed:
                - 'embed/**'
              backend:
                - 'backend/**'
              orchestrator:
                - 'orchestrator/**'
              frontend:
                - 'frontend/**'
              speakers:
                - 'speakers/**'
    python-check:
      needs: changes
      runs-on: ubuntu-latest
      strategy:
        matrix:
          components: ${{ fromJson(needs.changes.outputs.components-changed) }}
          exclude: 
            - components: frontend
            - components: speakers
      defaults:
        run:
          working-directory: ${{ matrix.components }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Install UV
          run: curl -LsSf https://astral.sh/uv/install.sh | sh
        - name: Cache dependencies
          uses: actions/cache@v6
          with:
            path: ~/.cache/pip
            key: ${{ matrix.components }}-pip-${{ hashFiles('**/uv.lock') }}
        - name: Install dependencies
          run: uv sync --locked --only-dev
        - name: Run checks
          run: | 
            uv run pytest 
            uv run ruff check .
            uv run ruff format --check .