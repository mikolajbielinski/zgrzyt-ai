name: Build and push Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contexts: ${{ steps.select.outputs.contexts }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect changed build contexts
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            download:
              - 'download/**'
            embed:
              - 'embed/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            speakers:
              - 'speakers/**'
            orchestrator:
              - 'orchestrator/**'

      # A tag or a manual run has no meaningful diff to compare against,
      # so rebuild everything. A push to main only rebuilds what changed —
      # every build produces a new digest, and nodes re-pull each one.
      - name: Select contexts to build
        id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          ALL: '["download","embed","backend","frontend","speakers","orchestrator"]'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "contexts=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "contexts=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.contexts != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: ${{ fromJSON(needs.changes.outputs.contexts) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mikolajbielinski/zgrzyt-${{ matrix.context }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
